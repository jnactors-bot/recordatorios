<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0f1115">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Recordatorios</title>
<style>
  :root { --bg:#0f1115; --card:#181b22; --ink:#eceff4; --mut:#9aa3b2; --ac:#c6ff3d; --bad:#ff6b6b; --line:#2a2f3a; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.4 system-ui,sans-serif; }
  main { max-width:560px; margin:0 auto; padding:16px; }
  h1 { font-size:20px; margin:8px 0 14px; }
  textarea,input,select,button { font:inherit; color:inherit; }
  textarea,input,select { width:100%; background:var(--card); border:1px solid var(--line); border-radius:10px; padding:12px; }
  textarea { min-height:84px; resize:vertical; }
  button { background:var(--ac); color:#111; border:0; border-radius:10px; padding:12px 16px; font-weight:600; cursor:pointer; }
  button.sec { background:var(--card); color:var(--ink); border:1px solid var(--line); }
  button:disabled { opacity:.5; cursor:default; }
  .row { display:flex; gap:10px; margin-top:10px; }
  .row > * { flex:1; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px; margin-top:14px; }
  label { display:block; font-size:13px; color:var(--mut); margin:10px 0 4px; }
  .msg { margin-top:12px; font-size:14px; }
  .bad { color:var(--bad); } .ok { color:var(--ac); } .mut { color:var(--mut); }
  ul { list-style:none; padding:0; margin:8px 0 0; }
  li { padding:8px 0; border-top:1px solid var(--line); display:flex; gap:10px; }
  li time { color:var(--mut); min-width:54px; }
  [hidden] { display:none !important; }
</style>
</head>
<body>
<main>
  <h1>Recordatorios</h1>

  <section id="setup" class="card" hidden>
    <strong>Primera vez en este equipo</strong>
    <label for="code">Código de acceso (el que pusiste como APP_TOKEN)</label>
    <input id="code" type="password" autocomplete="off">
    <div class="row"><button id="saveCode">Guardar</button></div>
  </section>

  <section id="main" hidden>
    <textarea id="text" placeholder="Ej.: hoy estoy de servicio, 6 pm bajar la bandera"></textarea>
    <div class="row"><button id="parse">Entender</button></div>

    <section id="preview" class="card" hidden>
      <label for="title">Título</label><input id="title">
      <div class="row">
        <div><label for="start">Inicio</label><input id="start" type="datetime-local"></div>
        <div><label for="end">Fin</label><input id="end" type="datetime-local"></div>
      </div>
      <label for="alert">Aviso antes</label>
      <select id="alert">
        <option value="10">10 minutos</option>
        <option value="15" selected>15 minutos</option>
        <option value="30">30 minutos</option>
        <option value="60">1 hora</option>
      </select>
      <label for="notes">Notas</label><input id="notes">
      <div id="doubt" class="msg mut" hidden></div>
      <div class="row">
        <button id="create">Crear en Calendar</button>
        <button id="cancel" class="sec">Descartar</button>
      </div>
    </section>

    <div id="msg" class="msg" role="status"></div>

    <section class="card">
      <strong>Hoy</strong>
      <ul id="today"><li class="mut">Cargando…</li></ul>
    </section>
    <p class="mut" style="font-size:13px"><a href="#" id="reset" style="color:inherit">Cambiar código</a></p>
  </section>
</main>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
